base:
  - template:_images/ubuntu

cpus: 4
memory: "10GiB"
disk: "50GiB"

mounts:
  - location: "~/.config/opencode"
    mountPoint: "{{ .Home }}/.config/opencode"
    writable: true
  - location: "~/.local/share/opencode"
    mountPoint: "{{ .Home }}/.local/share/opencode"
    writable: true
  - location: "~/.local/state/opencode"
    mountPoint: "{{ .Home }}/.local/state/opencode"
    writable: true
  - location: "~/.config/claude"
    mountPoint: "{{ .Home }}/.config/claude"
    writable: true
  - location: "~/.config/pi"
    mountPoint: "{{ .Home }}/.config/pi"
    writable: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    # language="shell script"
    script: |
      #!/bin/bash

      # System Basics
      apt-get update
      apt-get upgrade -y
      apt-get install -y htop vim curl git zsh ca-certificates jq yq zip build-essential

      usermod -s /bin/zsh "{{ .User }}"
      
      # Accept environment variables via SSH
      grep -qxF 'AcceptEnv *' /etc/ssh/sshd_config || echo 'AcceptEnv *' >> /etc/ssh/sshd_config
      systemctl reload ssh 2>/dev/null || systemctl reload sshd 2>/dev/null

      # Docker
      curl -fsSL https://get.docker.com | bash
  - mode: user
    # language="shell script"
    script: |
      #!/bin/bash

      # Add self to docker group
      sudo usermod -aG docker "$USER"

      # install brew
      /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      # Add shell config
      cat << 'EOF' >> "$HOME/.zshenv"
      eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv zsh)"
      
      export AI_SANDBOX="true"
      
      export XDG_CACHE_HOME="$HOME/.cache"
      export XDG_CONFIG_HOME="$HOME/.config"
      export XDG_DATA_HOME="$HOME/.local/share"
      export XDG_STATE_HOME="$HOME/.local/state"

      export PATH="$PATH:$HOME/.local/bin"
      
      export PI_CODING_AGENT_DIR="$XDG_CONFIG_HOME/pi/agent"
      
      export ZDOTDIR="${ZDOTDIR:=$XDG_CONFIG_HOME/zsh}"
      source "$ZDOTDIR/.zshenv"
      EOF

      # Install tools
      brew install \
        glab mise television uv `# general cli tooling` \
        codex anomalyco/tap/opencode-v2 pi-coding-agent `# coding agents`
      
      brew install --cask claude-code
